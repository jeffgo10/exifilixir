name: Deploy to Firebase (Hosting + Functions)

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch: {}

concurrency:
  group: firebase-deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@jeffgo10'
        env:
          # PAT with read:packages for @jeffgo10/* on GitHub Packages (see repo secrets).
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_READ_TOKEN }}

      - name: Install root deps
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_READ_TOKEN }}
        run: npm ci

      - name: Build static site (out/)
        env:
          # Public env baked into the client bundle at build time
          NEXT_PUBLIC_API_TOKEN: ${{ secrets.NEXT_PUBLIC_API_TOKEN }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_REGION: ${{ secrets.NEXT_PUBLIC_FIREBASE_REGION }}
          NEXT_PUBLIC_FIREBASE_FUNCTION_URL: ${{ secrets.NEXT_PUBLIC_FIREBASE_FUNCTION_URL }}
        run: npm run build

      - name: Install functions deps
        working-directory: functions
        run: npm ci

      - name: Build functions
        working-directory: functions
        run: npm run build

      - name: Install Firebase CLI
        run: npm i -g firebase-tools

      # FIREBASE_SERVICE_ACCOUNT must be the full service-account JSON key text
      # (starts with `{`). Prefer: gh secret set FIREBASE_SERVICE_ACCOUNT < key.json
      - name: Write and validate Google credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/firebase-sa.json"
          if [ -z "${FIREBASE_SERVICE_ACCOUNT// }" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT secret is empty. Paste the full GCP service account JSON key."
            exit 1
          fi
          # Accept raw JSON or base64-encoded JSON
          if printf '%s' "$FIREBASE_SERVICE_ACCOUNT" | head -c 1 | grep -q '{'; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$OUT"
          else
            if ! printf '%s' "$FIREBASE_SERVICE_ACCOUNT" | base64 --decode > "$OUT" 2>/dev/null; then
              echo "::error::FIREBASE_SERVICE_ACCOUNT is not JSON and not base64. Re-create the secret from the downloaded .json key file."
              exit 1
            fi
          fi
          if ! python3 -c "import json,sys; d=json.load(open(sys.argv[1])); assert d.get('type')=='service_account', d.get('type'); assert 'private_key' in d and 'client_email' in d" "$OUT"; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT is not a valid GCP service account key JSON (need type=service_account, private_key, client_email)."
            echo "::error::Download a new JSON key from GCP IAM → Service accounts → Keys, then: gh secret set FIREBASE_SERVICE_ACCOUNT < ./sa.json"
            exit 1
          fi
          echo "GOOGLE_APPLICATION_CREDENTIALS=$OUT" >> "$GITHUB_ENV"
          echo "Service account credentials JSON validated."

      # Function API_TOKEN is set ONCE outside CI (Cloud Run / Firebase Console).
      # Do not call firebase functions:secrets:set from this workflow.

      - name: Deploy (hosting + functions)
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: firebase --project "$FIREBASE_PROJECT_ID" --non-interactive deploy --only hosting,functions
